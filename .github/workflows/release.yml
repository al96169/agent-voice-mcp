name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install espeak-ng for TTS tests
        run: sudo apt-get update && sudo apt-get install -y espeak-ng

      - name: Build
        run: npm run build

      - name: Run tests
        timeout-minutes: 10
        run: npm test

      - name: Pack package
        run: npm pack --pack-destination=.

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: ./*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
